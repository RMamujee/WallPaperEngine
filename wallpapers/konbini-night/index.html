<!doctype html>
<meta charset="utf-8" />
<title>WallpaperForge - konbini night</title>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #060a12;
  }
  #gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* The snow falls across the whole frame, so this layer covers the screen and
     sits above the shader. Its top is still set from script rather than fixed
     at 0, because layout() owns the placement. */
  #fx {
    position: fixed;
    left: 0;
    display: block;
    pointer-events: none;
  }
  #error {
    position: fixed;
    inset: 0;
    display: none;
    place-content: center;
    font: 500 15px/1.6 system-ui, sans-serif;
    color: #8b93a7;
    text-align: center;
    padding: 8vh 10vw;
  }
</style>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="error"></div>

<script>
  /**
   * "Konbini night": a pixel-art store front at night, animated.
   *
   * The art is the whole point and it is fragile - every hard edge in it is
   * deliberate. So nothing here resamples the plate. The shader only scales the
   * colour a pixel already has, and the one place that does move pixels (the
   * wet floor) shifts by WHOLE SOURCE TEXELS, which slides the reflection
   * without ever blending two texels into a soft one.
   *
   *   - the shader owns the lights. Each vending machine's glass front breathes
   *     on its own rhythm, the ceiling tubes hum and occasionally stutter, one
   *     machine has a failing tube, the indicator lamps on the control panels
   *     blink slowly out of step with each other, and each machine's reflection
   *     in the wet floor brightens and dims with the machine above it
   *   - the overlay owns the snow, which is confined to the window band so it
   *     reads as weather on the far side of the glass
   *
   * Nothing is hand-placed. At boot the plate is measured: the lit band, the
   * seven machines, the ceiling tubes, the floor, the control-panel lamps and a
   * mask of the night city are all found from the artwork's own luminance,
   * saturation and colour (see analysePlate). Repaint the plate and the
   * geometry follows it.
   *
   * A LIGHT IS A REGION, NOT A BRIGHTNESS TEST. Each lamp gets the rectangle of
   * the surface it actually lights - this machine's glass window, this tube -
   * measured per lamp, and inside that rectangle every pixel is scaled by the
   * same factor. Two things fall out of that, and both are the difference
   * between a lamp and a stain:
   *
   *   - the light is the shape of the thing that emits it. An earlier version
   *     asked "is this pixel bright?" instead, over one shared full-width band.
   *     That lights whatever happens to be pale - the machines' own frames, the
   *     shopfront - so each light spread to the whole cabinet, and the band's
   *     straight edge cut across the products of any machine whose glass did
   *     not happen to end where the average one did.
   *   - a flat scale keeps the picture's contrast exactly as paint. Weighting
   *     the swing by each pixel's brightness stretches the palette instead, so
   *     the shelves flare toward white and the pixel art turns to mush. Only
   *     the additive bloom is brightness-gated, and only near white, because a
   *     lamp's core really does wash out.
   */

  const errorBox = document.getElementById('error');
  const glCanvas = document.getElementById('gl');
  const fxCanvas = document.getElementById('fx');

  function fail(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'grid';
  }

  const TAU = Math.PI * 2;
  const MAX_MACHINES = 8;
  const MAX_TUBES = 4;
  const MAX_BLINKERS = 12;

  const num = (value, fallback) => (Number.isFinite(Number(value)) ? Number(value) : fallback);
  const nums = (value, fallback) =>
    Array.isArray(value) && value.length === fallback.length
      ? value.map((v, i) => num(v, fallback[i]))
      : fallback;
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const lerp = (a, b, t) => a + (b - a) * t;

  /** Seeded PRNG, so a given `seed` always produces the same store. */
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ===========================================================================
  // Shader
  // ===========================================================================

  const VERT = `#version 300 es
  in vec2 aPos;
  out vec2 vUv;
  void main() {
    // Y is flipped so uv.y = 0 is the TOP of both screen and texture. The
    // texture half of that comes from uploading with UNPACK_FLIP_Y off, which
    // puts the image's first row at t = 0. Every band test downstream depends
    // on this convention; without it the plate renders upside down.
    vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
    gl_Position = vec4(aPos, 0.0, 1.0);
  }`;

  const FRAG = `#version 300 es
  precision highp float;

  in vec2 vUv;
  out vec4 fragColor;

  uniform sampler2D uImage;
  uniform vec2  uResolution;
  uniform vec2  uPlate;          // plate size in texels
  uniform float uImageAspect;
  uniform float uTime;

  uniform vec2  uFloorBand;      // image-space Y range of the wet floor

  // Every light is a rectangle in image UV, measured off the plate.
  uniform vec4  uMachineGlass[8]; // x0, x1, y0, y1 of one machine's glass window
  uniform vec2  uMachineCol[8];   // that machine's full cabinet width, for its
                                  // reflection, which is as wide as the machine
  uniform float uMachineLevel[8]; // this frame's brightness, per machine
  uniform int   uMachineCount;
  uniform vec4  uTubeRect[4];     // x0, x1, y0, y1 of one ceiling tube
  uniform float uTubeLevel[4];
  uniform int   uTubeCount;
  uniform vec4  uBlinkRect[12];   // x0, x1, y0, y1 of one control-panel lamp
  uniform float uBlinkLevel[12];
  uniform int   uBlinkCount;

  uniform vec2  uGlassFeather;   // how far each light fades out, x and y, in UV
  uniform vec2  uTubeFeather;
  uniform vec2  uBlinkFeather;
  uniform float uFloorFeather;
  uniform float uFloorGain;      // how much of a machine's swing reaches its reflection
  uniform float uFloorWobble;    // reflection wobble, in WHOLE source texels
  uniform float uFloorWobbleRate;
  uniform float uBloom;          // extra lift toward white on the up-swing
  uniform vec2  uBloomLevels;    // ... which only pixels this bright receive

  /** Screen UV -> image UV for a cover (crop) fit. The plate is 16:10 like the
      target display, so in practice this is the identity. */
  vec2 coverUv(vec2 uv) {
    float screenAspect = uResolution.x / uResolution.y;
    vec2 scale = screenAspect > uImageAspect
      ? vec2(1.0, uImageAspect / screenAspect)
      : vec2(screenAspect / uImageAspect, 1.0);
    return (uv - 0.5) * scale + 0.5;
  }

  // 1 inside a range, ramping over "edge" at both ends so nothing shows a seam.
  float span(vec2 range, float v, float edge) {
    return smoothstep(range.x - edge, range.x + edge, v)
         * (1.0 - smoothstep(range.y - edge, range.y + edge, v));
  }

  // A lamp's footprint: soft on all four sides. The feather is what stops the
  // rectangle from being visible as a rectangle - it has to be wide enough that
  // the edge lands somewhere unlit (a bezel, the dark ceiling) rather than
  // ending mid-shelf.
  float softBox(vec4 rect, vec2 p, vec2 feather) {
    return span(rect.xy, p.x, feather.x) * span(rect.zw, p.y, feather.y);
  }

  void main() {
    vec2 base = coverUv(vUv);

    // -- the wet floor moves, everything else only changes brightness --------
    //
    // Water is the one thing in this picture that should not sit perfectly
    // still, but the plate is pixel art: sampling it at a fractional offset
    // blends two source texels and softens exactly the hard edges that make it
    // read as pixel art. So the offset is rounded to whole texels. The
    // reflection slides in visible steps, which is both correct for the medium
    // and cheaper than any filtered alternative.
    float floorRamp = span(uFloorBand, base.y, uFloorFeather);

    vec2 uv = base;
    if (floorRamp > 0.002) {
      float t = uTime * uFloorWobbleRate;
      float wob = sin(base.x * 118.0 + t * 0.81)
                + 0.62 * sin(base.x * 43.0 - t * 0.53 + 2.1)
                + 0.34 * sin(base.x * 227.0 + t * 1.27 + 5.0);
      uv.y += floor(wob * uFloorWobble * floorRamp + 0.5) / uPlate.y;
    }

    vec3 color = texture(uImage, clamp(uv, 0.0, 1.0)).rgb;
    float l = dot(color, vec3(0.299, 0.587, 0.114));

    // Only the core of a lamp washes toward white as it brightens; a shelf in
    // shadow behind the same glass just gets brighter. This gate is used ONLY
    // for that additive term - never for the scale - so the picture's contrast
    // is untouched. Do not name it "flat": that is a reserved interpolation
    // qualifier in GLSL ES 3. Avoid backticks in here too: this shader is a JS
    // template literal and one anywhere inside, comments included, would end it
    // early.
    float core = smoothstep(uBloomLevels.x, uBloomLevels.y, l);

    // -- the machines -------------------------------------------------------
    //
    // Two footprints per machine, because a machine lights two different
    // things: its own glass window, and its reflection in the wet floor, which
    // is as wide as the whole cabinet rather than as wide as the glass.
    //
    // Both accumulate a weighted average rather than picking one machine, so
    // where two footprints meet the level crossfades. The bezels between the
    // machines are dark and would hide a hard switch, but their reflections run
    // together on the floor and a hard switch there draws a vertical seam.
    float gAcc = 0.0;
    float gSum = 0.0;
    float cAcc = 0.0;
    float cSum = 0.0;
    for (int i = 0; i < 8; i++) {
      if (i >= uMachineCount) break;
      float level = uMachineLevel[i];

      float g = softBox(uMachineGlass[i], base, uGlassFeather);
      gAcc += level * g;
      gSum += g;

      float c = span(uMachineCol[i], base.x, 0.006);
      cAcc += level * c;
      cSum += c;
    }

    if (gSum > 0.001) {
      float level = gAcc / gSum;
      float amt = min(1.0, gSum);
      color *= mix(1.0, level, amt);
      color += max(0.0, level - 1.0) * amt * core * uBloom;
    }

    // The reflection. floorRamp is zero everywhere the glass footprints reach,
    // so nothing is scaled twice.
    if (cSum > 0.001) {
      float level = cAcc / cSum;
      float amt = floorRamp * min(1.0, cSum) * uFloorGain;
      color *= mix(1.0, level, amt);
      color += max(0.0, level - 1.0) * amt * core * uBloom;
    }

    // -- ceiling tubes ------------------------------------------------------
    float tAcc = 0.0;
    float tSum = 0.0;
    for (int i = 0; i < 4; i++) {
      if (i >= uTubeCount) break;
      float w = softBox(uTubeRect[i], base, uTubeFeather);
      tAcc += uTubeLevel[i] * w;
      tSum += w;
    }
    if (tSum > 0.001) {
      float level = tAcc / tSum;
      float amt = min(1.0, tSum);
      color *= mix(1.0, level, amt);
      color += max(0.0, level - 1.0) * amt * core * uBloom;
    }

    // -- the indicator lamps on the control panels --------------------------
    //
    // Same footprint-and-scale as every other lamp here, only much smaller:
    // these are readouts and LEDs a few art pixels across. Their rectangles are
    // already padded by the feather on the way in, so the whole lamp swings at
    // the full level and the ramp lands on the dark housing around it.
    float kAcc = 0.0;
    float kSum = 0.0;
    for (int i = 0; i < 12; i++) {
      if (i >= uBlinkCount) break;
      float w = softBox(uBlinkRect[i], base, uBlinkFeather);
      kAcc += uBlinkLevel[i] * w;
      kSum += w;
    }
    if (kSum > 0.001) {
      float level = kAcc / kSum;
      float amt = min(1.0, kSum);
      color *= mix(1.0, level, amt);
      color += max(0.0, level - 1.0) * amt * core * uBloom;
    }

    fragColor = vec4(color, 1.0);
  }`;

  function compile(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader) || 'shader compile failed');
    }
    return shader;
  }

  function buildProgram(gl) {
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, VERT));
    gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || 'program link failed');
    }
    return program;
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('Could not load ' + src));
      image.src = src;
    });
  }

  // ===========================================================================
  // Measuring the plate
  // ===========================================================================

  /** The contiguous run around the strongest row, out to `frac` of the peak. */
  function peakBand(values, lo, hi, frac) {
    let best = lo;
    for (let i = lo; i < hi; i++) if (values[i] > values[best]) best = i;
    const cut = values[best] * frac;
    let a = best;
    let b = best;
    while (a > lo && values[a - 1] > cut) a--;
    while (b < hi - 1 && values[b + 1] > cut) b++;
    return [a, b];
  }

  /** Runs above `thresh`; gaps up to `maxGap` are bridged, short runs dropped. */
  function findRuns(values, thresh, maxGap, minWidth) {
    const out = [];
    let start = -1;
    for (let i = 0; i <= values.length; i++) {
      const on = i < values.length && values[i] > thresh;
      if (on && start < 0) start = i;
      else if (!on && start >= 0) {
        const last = out[out.length - 1];
        if (last && start - last[1] <= maxGap) last[1] = i;
        else out.push([start, i]);
        start = -1;
      }
    }
    return out.filter((r) => r[1] - r[0] >= minWidth);
  }

  /** Box blur along an array. Row profiles are noisy at single-row resolution,
      and a band found by walking outward from a peak stops at the first dip. */
  function smoothed(values, radius) {
    const out = new Float32Array(values.length);
    for (let i = 0; i < values.length; i++) {
      let sum = 0;
      let n = 0;
      for (let k = -radius; k <= radius; k++) {
        const j = i + k;
        if (j >= 0 && j < values.length) {
          sum += values[j];
          n++;
        }
      }
      out[i] = sum / n;
    }
    return out;
  }

  /**
   * Everything this wallpaper needs to know about the artwork, read off the
   * artwork. Nothing below is a coordinate someone typed in.
   *
   * The lit machine fronts are the brightest, most saturated thing in the
   * picture, so a luminance-and-saturation count per row finds the band they
   * live in, and the same count per column inside that band finds the machines:
   * each one is a run of lit columns, and the dark bezels between them are the
   * gaps. The ceiling tubes are the opposite - bright but nearly colourless -
   * which separates them from the machines cleanly. The floor is simply the
   * brightest band below everything else.
   *
   * Those bands locate the lamps. They are NOT the lamps: every lamp is then
   * measured on its own, because the machines in this plate are not a tidy row.
   * Their glass windows start and stop at different heights, and each sits
   * inside a cabinet frame that is pale and bright but emits nothing. A shared
   * band lights the frames along with the glass and cuts a straight edge across
   * whichever machine disagrees with the average. So each machine re-measures
   * its own window inside its own columns, and each tube its own box.
   */
  function analysePlate(image) {
    const W = image.naturalWidth || image.width;
    const H = image.naturalHeight || image.height;

    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(image, 0, 0);
    const data = ctx.getImageData(0, 0, W, H).data;

    const lumAt = (x, y) => {
      const i = (y * W + x) * 4;
      return (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) / 255;
    };
    const satAt = (x, y) => {
      const i = (y * W + x) * 4;
      const hi = Math.max(data[i], data[i + 1], data[i + 2]);
      const lo = Math.min(data[i], data[i + 1], data[i + 2]);
      return hi <= 1 ? 0 : (hi - lo) / hi;
    };
    const isLit = (x, y) => lumAt(x, y) > 0.34 && satAt(x, y) > 0.18;
    const isPale = (x, y) => lumAt(x, y) > 0.30 && satAt(x, y) < 0.45;

    // -- the band of lit machine fronts, and the machines inside it ----------
    const rowLit = new Float32Array(H);
    for (let y = 0; y < H; y++) {
      let c = 0;
      let n = 0;
      for (let x = 0; x < W; x += 4) {
        if (isLit(x, y)) c++;
        n++;
      }
      rowLit[y] = c / n;
    }
    const [gTop, gBot] = peakBand(smoothed(rowLit, 6), Math.round(0.25 * H), Math.round(0.80 * H), 0.35);

    const colLit = new Float32Array(W);
    for (let x = 0; x < W; x++) {
      let c = 0;
      let n = 0;
      for (let y = gTop; y <= gBot; y += 3) {
        if (isLit(x, y)) c++;
        n++;
      }
      colLit[x] = c / n;
    }
    const machineCols = findRuns(colLit, 0.05, 18, 110).slice(0, MAX_MACHINES);

    /**
     * How tall one lamp is, inside columns the band has already narrowed to.
     *
     * Per column, the topmost and bottommost row that passes `test`; then the
     * MEDIAN of each across the columns. Not a row profile: the dark shelf
     * dividers inside a vending machine are full-width dips, so any row-wise
     * measure either halts at the first divider - clipping the window to one
     * shelf - or has to bridge gaps so wide it escapes the machine entirely.
     * Per column there is no divider to trip over, and the median then ignores
     * both the column that catches a sign above the cabinet and the one whose
     * top shelf happens to hold something dark.
     */
    const verticalSpan = (test, x0, x1, lo, hi) => {
      const tops = [];
      const bottoms = [];
      for (let x = x0; x < x1; x += 2) {
        let top = -1;
        let bottom = -1;
        for (let y = lo; y < hi; y++) {
          if (!test(x, y)) continue;
          if (top < 0) top = y;
          bottom = y;
        }
        if (top >= 0) {
          tops.push(top);
          bottoms.push(bottom);
        }
      }
      if (!tops.length) return [lo, hi];
      const mid = (arr) => arr.sort((a, b) => a - b)[arr.length >> 1];
      return [mid(tops), mid(bottoms)];
    };
    const colsWhere = (test, x0, x1, y0, y1, frac) => {
      const prof = new Float32Array(x1 - x0);
      let peak = 0;
      for (let x = x0; x < x1; x++) {
        let c = 0;
        let n = 0;
        for (let y = y0; y <= y1; y += 2) {
          if (test(x, y)) c++;
          n++;
        }
        prof[x - x0] = n ? c / n : 0;
        if (prof[x - x0] > peak) peak = prof[x - x0];
      }
      const cut = peak * frac;
      let a = 0;
      let b = prof.length - 1;
      while (a < b && prof[a] < cut) a++;
      while (b > a && prof[b] < cut) b--;
      return [x0 + a, x0 + b + 1];
    };

    // -- each machine's own glass window -------------------------------------
    //
    // Vertical first, because the window's height is what the shared band got
    // wrong; then horizontal, which is what trims the cabinet frame off. The
    // frame is bright but colourless, so it fails isLit and falls outside the
    // run - the same test that told the machines apart also tells a machine
    // from its own frame.
    //
    // The search is bounded to the shared band plus a margin. A machine's own
    // window is free to start higher or end lower than the average one - that
    // freedom is the whole point - but not free to wander up into the lit
    // shelves behind the shopfront glass, which pass the same test.
    //
    // The margin is lopsided because the row is: the machines stand on one
    // floor under one ceiling so their windows start at nearly one height, but
    // they are different cabinets and their windows end wherever each one's
    // dispensing bay begins. Tight above, loose below.
    const mLo = Math.max(0, gTop - Math.round(0.025 * H));
    const mHi = Math.min(H, gBot + Math.round(0.07 * H));
    const machines = machineCols.map(([x0, x1]) => {
      const [wy0, wy1] = verticalSpan(isLit, x0, x1, mLo, mHi);
      const [wx0, wx1] = colsWhere(isLit, x0, x1, wy0, wy1, 0.35);
      return {
        col: [x0 / W, x1 / W],
        glass: [wx0 / W, wx1 / W, wy0 / H, wy1 / H]
      };
    });

    // -- ceiling tubes: bright but colourless -------------------------------
    const rowPale = new Float32Array(H);
    for (let y = 0; y < H; y++) {
      let c = 0;
      let n = 0;
      for (let x = 0; x < W; x += 4) {
        if (isPale(x, y)) c++;
        n++;
      }
      rowPale[y] = c / n;
    }
    const [tTop, tBot] = peakBand(smoothed(rowPale, 2), Math.round(0.08 * H), Math.round(0.26 * H), 0.3);

    const colPale = new Float32Array(W);
    for (let x = 0; x < W; x++) {
      let c = 0;
      let n = 0;
      for (let y = tTop; y <= tBot; y++) {
        if (isPale(x, y)) c++;
        n++;
      }
      colPale[x] = c / n;
    }
    const tubeCols = findRuns(colPale, 0.15, 80, 80).slice(0, MAX_TUBES);

    // A tube is thin, so its own box matters more than a machine's: the shared
    // band was three times the height of the fixture, which spread each tube's
    // stutter onto the ceiling and the shopfront above it.
    const tLo = Math.max(0, tTop - Math.round(0.02 * H));
    const tHi = Math.min(H, tBot + Math.round(0.02 * H));
    const tubes = tubeCols.map(([x0, x1]) => {
      const [ty0, ty1] = verticalSpan(isPale, x0, x1, tLo, tHi);
      return [x0 / W, x1 / W, ty0 / H, ty1 / H];
    });

    // -- the wet floor: the bright band below everything else ----------------
    const rowLum = new Float32Array(H);
    for (let y = 0; y < H; y++) {
      let s = 0;
      let n = 0;
      for (let x = 0; x < W; x += 4) {
        s += lumAt(x, y);
        n++;
      }
      rowLum[y] = s / n;
    }
    const [fTop, fBot] = peakBand(smoothed(rowLum, 4), Math.round(0.75 * H), Math.round(0.97 * H), 0.45);

    // -- the indicator lamps on each machine's control panel -----------------
    //
    // A real machine wears its lamps on the cabinet, not behind the product
    // glass: the credit readout, the LED on the card reader, the lit icons over
    // the coin slot. So the search runs below each machine's own window, inside
    // its own columns, down to the floor.
    //
    // Finding them is not a brightness test, because this cabinet band is dark
    // everywhere and the cabinets themselves range from near-black green to
    // white. Three measurements together say "lamp", and each one throws out a
    // different impostor:
    //
    //   - it breaks the night's colour. The whole picture is cast blue (the
    //     median colour of the plate is the reference), and anything merely lit
    //     by that night keeps the cast - which is every paper notice taped to
    //     these machines. A lamp makes its own colour and does not.
    //   - it is saturated. That drops the pale and near-grey shapes printed on
    //     the signage, which also break the cast but are ink, not light.
    //   - it is brighter than its immediate surroundings, and its surroundings
    //     are darker than the cabinet's own face - that is, it sits down inside
    //     a recess. Lamps are set into the coin unit and the readout housing;
    //     a poster is stuck flat on the outside of the cabinet.
    //
    // A machine whose window runs all the way to the floor has no cabinet at
    // all, only shelves of product, and every bright speck in it is a label. So
    // a machine is skipped outright if its band is too busy to be a panel.
    //
    // Some machines end up with no lamp. That is the artwork's answer, not a
    // failure: forcing one on every machine is exactly the hand-placing this
    // file exists to avoid.
    const medianColour = (x0, x1, y0, y1, step) => {
      const bins = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
      let n = 0;
      for (let y = y0; y < y1; y += step) {
        for (let x = x0; x < x1; x += step) {
          const i = (y * W + x) * 4;
          bins[0][data[i]]++;
          bins[1][data[i + 1]]++;
          bins[2][data[i + 2]]++;
          n++;
        }
      }
      return bins.map((bin) => {
        let acc = 0;
        for (let v = 0; v < 256; v++) {
          acc += bin[v];
          if (acc >= n / 2) return v;
        }
        return 0;
      });
    };
    const lumOf = (c) => (c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114) / 255;
    // How far a colour sits from the night's own colour, with brightness
    // divided out first. Without that division every test below is a brightness
    // test wearing a hat: a dim lamp and a bright one of the same hue have to
    // compare equal.
    const nightHue = (() => {
      const c = medianColour(0, W, 0, H, 2);
      const s = c[0] + c[1] + c[2] || 1;
      return [c[0] / s, c[1] / s, c[2] / s];
    })();
    const hueGap = (r, g, b) => {
      const s = r + g + b || 1;
      return (
        Math.abs(r / s - nightHue[0]) + Math.abs(g / s - nightHue[1]) + Math.abs(b / s - nightHue[2])
      );
    };

    // Everything below is in art pixels, so it is written as a fraction of the
    // plate: a bigger repaint of the same picture measures the same way.
    const LAMP_NEAR = Math.max(4, Math.round(0.0055 * W)); // local-background radius
    const LAMP_GLUE = Math.max(1, Math.round(0.0004 * W)); // one art pixel of slack when grouping
    const LAMP_MIN = Math.max(2, Math.round(0.0016 * W)); // one art pixel of this plate
    const LAMP_MAX = Math.round(0.0133 * W);
    const LAMP_RING = Math.max(4, Math.round(0.0047 * W)); // how far out "surroundings" reaches

    const blinkers = [];
    machines.forEach((m, mi) => {
      const bx0 = Math.round(m.col[0] * W);
      const bx1 = Math.round(m.col[1] * W);
      const by0 = Math.round(m.glass[3] * H);
      const by1 = fTop;
      const w = bx1 - bx0;
      const h = by1 - by0;
      if (w < 8 * LAMP_MIN || h < 8 * LAMP_MIN) return;

      const face = medianColour(bx0, bx1, by0, by1, 1);
      const faceLum = lumOf(face);

      // Is this a cabinet at all? Mean neighbour-to-neighbour change over one
      // art pixel: a painted panel barely changes, a rack of bottles never
      // stops changing.
      let churn = 0;
      let churnN = 0;
      for (let y = by0; y < by1 - LAMP_MIN; y++) {
        for (let x = bx0; x < bx1 - LAMP_MIN; x++) {
          const l = lumAt(x, y);
          churn += Math.abs(lumAt(x + LAMP_MIN, y) - l) + Math.abs(lumAt(x, y + LAMP_MIN) - l);
          churnN++;
        }
      }
      if (churn / Math.max(1, churnN) > 0.085) return;

      const lum = new Float32Array(w * h);
      const gap = new Float32Array(w * h);
      const sat = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = ((y + by0) * W + (x + bx0)) * 4;
          const j = y * w + x;
          lum[j] = lumAt(x + bx0, y + by0);
          gap[j] = hueGap(data[i], data[i + 1], data[i + 2]);
          sat[j] = satAt(x + bx0, y + by0);
        }
      }

      // Local background brightness, from a summed-area table so the window can
      // be wide without costing anything.
      const sums = new Float64Array((w + 1) * (h + 1));
      for (let y = 0; y < h; y++) {
        let run = 0;
        for (let x = 0; x < w; x++) {
          run += lum[y * w + x];
          sums[(y + 1) * (w + 1) + x + 1] = sums[y * (w + 1) + x + 1] + run;
        }
      }
      const near = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const ax = Math.max(0, x - LAMP_NEAR);
          const ay = Math.max(0, y - LAMP_NEAR);
          const zx = Math.min(w, x + LAMP_NEAR + 1);
          const zy = Math.min(h, y + LAMP_NEAR + 1);
          near[y * w + x] =
            (sums[zy * (w + 1) + zx] -
              sums[ay * (w + 1) + zx] -
              sums[zy * (w + 1) + ax] +
              sums[ay * (w + 1) + ax]) /
            ((zx - ax) * (zy - ay));
        }
      }

      const lit = new Uint8Array(w * h);
      for (let j = 0; j < w * h; j++) {
        if (lum[j] >= near[j] + 0.05 && gap[j] >= 0.14 && sat[j] >= 0.35) lit[j] = 1;
      }
      // Grown by one art pixel before grouping, so the separate strokes of one
      // readout join into a single lamp instead of blinking digit by digit.
      const grown = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (!lit[y * w + x]) continue;
          for (let dy = -LAMP_GLUE; dy <= LAMP_GLUE; dy++) {
            const yy = y + dy;
            if (yy < 0 || yy >= h) continue;
            for (let dx = -LAMP_GLUE; dx <= LAMP_GLUE; dx++) {
              const xx = x + dx;
              if (xx >= 0 && xx < w) grown[yy * w + xx] = 1;
            }
          }
        }
      }

      const done = new Uint8Array(w * h);
      const stack = [];
      const kept = [];
      const reach = (j) => {
        if (!grown[j] || done[j]) return;
        done[j] = 1;
        stack.push(j);
      };
      for (let sy = 0; sy < h; sy++) {
        for (let sx = 0; sx < w; sx++) {
          const seed = sy * w + sx;
          if (!grown[seed] || done[seed]) continue;
          done[seed] = 1;
          stack.length = 0;
          stack.push(seed);
          let gx0 = sx;
          let gx1 = sx;
          let gy0 = sy;
          let gy1 = sy;
          let blob = 0;
          while (stack.length) {
            const i = stack.pop();
            const x = i % w;
            const y = (i / w) | 0;
            blob++;
            if (x < gx0) gx0 = x;
            if (x > gx1) gx1 = x;
            if (y < gy0) gy0 = y;
            if (y > gy1) gy1 = y;
            if (x > 0) reach(i - 1);
            if (x < w - 1) reach(i + 1);
            if (y > 0) reach(i - w);
            if (y < h - 1) reach(i + w);
          }

          // Shrink back onto what actually lit up: the grown mask found the
          // group, the original one gives the lamp its edges.
          let ax = gx1;
          let zx = gx0;
          let ay = gy1;
          let zy = gy0;
          let area = 0;
          let gapSum = 0;
          let liftSum = 0;
          for (let y = gy0; y <= gy1; y++) {
            for (let x = gx0; x <= gx1; x++) {
              const i = y * w + x;
              if (!lit[i]) continue;
              area++;
              gapSum += gap[i];
              liftSum += lum[i] - near[i];
              if (x < ax) ax = x;
              if (x > zx) zx = x;
              if (y < ay) ay = y;
              if (y > zy) zy = y;
            }
          }
          if (!area) continue;

          const lw = zx - ax + 1;
          const lh = zy - ay + 1;
          // Anything against the edge of the band is only half measured: it
          // runs on into the machine next door, or up behind the glass.
          if (ax === 0 || ay === 0 || zx === w - 1 || zy === h - 1) continue;
          if (lw < LAMP_MIN || lh < LAMP_MIN || lw > LAMP_MAX || lh > LAMP_MAX) continue;
          if (area < LAMP_MIN * LAMP_MIN) continue;
          if (blob / ((gx1 - gx0 + 1) * (gy1 - gy0 + 1)) < 0.55) continue;
          const gapMean = gapSum / area;
          const liftMean = liftSum / area;
          if (gapMean < 0.17 || liftMean < 0.105) continue;

          // The surroundings decide it: crowded with other bright specks means
          // a shelf rather than a panel, and a surround no darker than the
          // cabinet's face means the thing is stuck on the outside of it.
          let crowd = 0;
          let dark = 0;
          let n = 0;
          const rx0 = Math.max(0, ax - LAMP_RING);
          const ry0 = Math.max(0, ay - LAMP_RING);
          const rx1 = Math.min(w, zx + 1 + LAMP_RING);
          const ry1 = Math.min(h, zy + 1 + LAMP_RING);
          for (let y = ry0; y < ry1; y++) {
            for (let x = rx0; x < rx1; x++) {
              if (x >= ax && x <= zx && y >= ay && y <= zy) continue;
              n++;
              if (lit[y * w + x]) crowd++;
              dark += lum[y * w + x];
            }
          }
          if (crowd / Math.max(1, n) > 0.22) continue;
          if (dark / Math.max(1, n) > faceLum * 0.9) continue;

          kept.push({
            machine: mi,
            score: gapMean * liftMean * Math.sqrt(area),
            rect: [ax + bx0, zx + bx0 + 1, ay + by0, zy + by0 + 1]
          });
        }
      }

      // Two lamps that all but touch are one fixture - the two halves of a
      // credit readout - and giving them separate rhythms would show the seam
      // between them.
      for (const lamp of kept) {
        const mate = blinkers.find(
          (b) =>
            b.machine === mi &&
            b.rect[0] - LAMP_RING < lamp.rect[1] &&
            b.rect[1] + LAMP_RING > lamp.rect[0] &&
            b.rect[2] - LAMP_RING < lamp.rect[3] &&
            b.rect[3] + LAMP_RING > lamp.rect[2]
        );
        if (mate) {
          mate.rect[0] = Math.min(mate.rect[0], lamp.rect[0]);
          mate.rect[1] = Math.max(mate.rect[1], lamp.rect[1]);
          mate.rect[2] = Math.min(mate.rect[2], lamp.rect[2]);
          mate.rect[3] = Math.max(mate.rect[3], lamp.rect[3]);
          mate.score = Math.max(mate.score, lamp.score);
        } else {
          blinkers.push(lamp);
        }
      }
    });
    blinkers.sort((a, b) => b.score - a.score);

    // -- the window: where snow is allowed to fall ---------------------------
    //
    // We are inside the store looking out, so snow may only appear over the
    // night city. Colour alone cannot say where that is - almost everything in
    // a night scene is blueish - so this is three tests at once: the band
    // between the ceiling tubes and the tops of the machines, to the right of
    // the interior shelving (which ends exactly where the first machine
    // begins), and a colour that is dark and clearly blue rather than teal,
    // warm or pale. Signage, the potted plant and the stocked shelves in front
    // of the glass all fail the colour test, so snow passes behind them.
    //
    // Eroding by one cell afterwards throws away isolated cells - the dark gaps
    // between products inside the store, which are the same colour as the sky
    // but are emphatically not outside.
    const MW = 512;
    const MH = 320;
    const winTop = (tBot + 6) / H;
    const winBot = (gTop - 8) / H;
    const winLeft = machineCols.length ? machineCols[0][0] / W : 0;

    const raw = new Uint8Array(MW * MH);
    for (let cy = 0; cy < MH; cy++) {
      const yc = (cy + 0.5) / MH;
      if (yc < winTop || yc > winBot) continue;
      const y0 = Math.floor((cy * H) / MH);
      const y1 = Math.floor(((cy + 1) * H) / MH);
      for (let cx = 0; cx < MW; cx++) {
        if ((cx + 0.5) / MW < winLeft) continue;
        const x0 = Math.floor((cx * W) / MW);
        const x1 = Math.floor(((cx + 1) * W) / MW);
        let r = 0;
        let g = 0;
        let b = 0;
        let n = 0;
        for (let y = y0; y < y1; y += 2) {
          for (let x = x0; x < x1; x += 2) {
            const i = (y * W + x) * 4;
            r += data[i];
            g += data[i + 1];
            b += data[i + 2];
            n++;
          }
        }
        if (!n) continue;
        r /= n;
        g /= n;
        b /= n;
        const l = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
        if (b - r > 14 && b - g > 12 && l > 0.03 && l < 0.3) raw[cy * MW + cx] = 1;
      }
    }
    const mask = new Uint8Array(MW * MH);
    for (let y = 1; y < MH - 1; y++) {
      for (let x = 1; x < MW - 1; x++) {
        const i = y * MW + x;
        mask[i] = raw[i] && raw[i - 1] && raw[i + 1] && raw[i - MW] && raw[i + MW] ? 1 : 0;
      }
    }

    return {
      width: W,
      height: H,
      floorBand: [fTop / H, fBot / H],
      machines,
      tubes,
      blinkers: blinkers.map((b) => ({
        machine: b.machine,
        rect: [b.rect[0] / W, b.rect[1] / W, b.rect[2] / H, b.rect[3] / H]
      })),
      window: { mw: MW, mh: MH, mask, top: winTop, bottom: winBot, left: winLeft }
    };
  }

  // ===========================================================================
  // The lights
  // ===========================================================================

  /**
   * An event that fires on an irregular timer and lasts a fixed while.
   * Returns progress through the current event in 0..1, or -1 between them.
   */
  function makeSchedule(mean, jitter, length, rnd) {
    const gap = () => Math.max(0.6, mean + (rnd() * 2 - 1) * jitter);
    let next = rnd() * mean; // stagger the first one, so boot is not a chorus
    let start = -1;
    return (t) => {
      if (start < 0 && t >= next) start = t;
      if (start >= 0) {
        const p = (t - start) / length;
        if (p < 1) return p;
        start = -1;
        next = t + gap();
      }
      return -1;
    };
  }

  /**
   * Brightness for every machine front and every ceiling tube, per frame.
   *
   * Machines: two slow sines at rates that share no common period, each machine
   * with its own pair, so the row shimmers instead of pulsing as one and never
   * returns to a state you have already seen.
   *
   * Tubes: near-steady with a shallow mains ripple, plus a hard stutter every
   * ten or twenty seconds. The stutter is a stepped waveform rather than a
   * smooth dip, because that is what a starting fluorescent actually does.
   *
   * One machine, picked by the seed rather than named, has a failing tube: a
   * permanent faint unsteadiness, and every several seconds a slow visible
   * flutter that no other machine does.
   *
   * Indicator lamps: one slow swell each, several seconds long, eased at both
   * ends so the lamp arrives at bright and at dim rather than arriving at a
   * corner. Every lamp draws its own period and its own phase, so no two are
   * ever together and the row never pulses as one. The swing is small on
   * purpose - these are lamps the size of a fingernail and the point is that
   * you notice them only once you look.
   */
  function createLights(props, machineCount, tubeCount, blinkCount) {
    const seed = Math.round(num(props.seed, 7));
    const rnd = mulberry32(seed * 2654435761);

    const rate = num(props.breatheRate, 1);
    const depth = num(props.breatheDepth, 0.085);
    const humRate = num(props.humRate, 6.7);
    const humDepth = num(props.humDepth, 0.02);

    const machines = [];
    for (let i = 0; i < machineCount; i++) {
      machines.push({
        rateA: TAU * 0.105 * rate * (0.74 + 0.58 * rnd()),
        rateB: TAU * 0.187 * rate * (0.8 + 0.62 * rnd()),
        phaseA: rnd() * TAU,
        phaseB: rnd() * TAU,
        depth: depth * (0.72 + 0.56 * rnd())
      });
    }

    const tubes = [];
    for (let i = 0; i < tubeCount; i++) {
      tubes.push({
        phase: rnd() * TAU,
        hum: humRate * (0.94 + 0.12 * rnd()),
        stutter: makeSchedule(
          num(props.stutterEvery, 15),
          num(props.stutterJitter, 8),
          Math.max(0.06, num(props.stutterLength, 0.34)),
          rnd
        )
      });
    }

    // A starting tube goes dark, catches, drops out again, then holds. Stepped,
    // not eased: the whole character of the thing is that it snaps.
    const STUTTER = [0.22, 1.0, 0.38, 0.95, 0.18, 0.72, 1.0];

    const requested = Math.round(num(props.failingMachine, -1));
    const failing =
      requested >= 0 && requested < machineCount
        ? requested
        : machineCount > 0
          ? Math.floor(rnd() * machineCount)
          : -1;
    const failDepth = num(props.failDepth, 0.42);
    const failRate = num(props.failRate, 1);
    const failBurst = makeSchedule(
      num(props.failBurstEvery, 7.5),
      num(props.failBurstJitter, 4),
      Math.max(0.2, num(props.failBurstLength, 1.35)),
      rnd
    );
    const failRnd = mulberry32(seed * 40503 + 17);
    // A sample-and-hold table: the failing tube reads back from this a few
    // times a second, so its flicker is irregular but repeatable and costs
    // nothing. Slow enough that you see each dip as a dip - run it much faster
    // and a dying tube turns into video noise.
    const FAIL_HOLD_HZ = 4.2;
    const FAIL_STEPS = 64;
    const failTable = new Float32Array(FAIL_STEPS);
    for (let i = 0; i < FAIL_STEPS; i++) {
      const r = failRnd();
      failTable[i] = r < 0.34 ? 1 : r < 0.58 ? 0.45 : 0;
    }

    // Drawn after the machines and tubes so that adding a lamp cannot reshuffle
    // which machine has the failing tube: this PRNG is one stream and every
    // draw moves it on.
    const blinkPeriod = Math.max(0.8, num(props.blinkPeriod, 4.6));
    const blinkJitter = Math.max(0, num(props.blinkJitter, 2));
    const blinkDepth = num(props.blinkDepth, 0.11);
    const blinks = [];
    for (let i = 0; i < blinkCount; i++) {
      const period = Math.max(0.8, blinkPeriod + (rnd() * 2 - 1) * blinkJitter);
      blinks.push({
        rate: TAU / period,
        phase: rnd() * TAU,
        depth: blinkDepth * (0.78 + 0.44 * rnd())
      });
    }

    const machineLevels = new Float32Array(machineCount);
    const tubeLevels = new Float32Array(tubeCount);
    const blinkLevels = new Float32Array(blinkCount);

    function step(t) {
      for (let i = 0; i < machineCount; i++) {
        const m = machines[i];
        const breathe =
          0.66 * Math.sin(t * m.rateA + m.phaseA) + 0.34 * Math.sin(t * m.rateB + m.phaseB);
        let level = 1 + m.depth * breathe;

        if (i === failing) {
          // Never quite well: a slow shallow sag even between bursts.
          level *= 1 - 0.035 * (0.5 + 0.5 * Math.sin(t * 2.9 * failRate));
          const p = failBurst(t);
          if (p >= 0) {
            // Ramp in and out so the burst arrives and leaves rather than
            // being switched on, which would read as a glitch in the video.
            const env = Math.sin(Math.PI * clamp01(p));
            const hold = failTable[Math.floor(t * FAIL_HOLD_HZ * failRate) % FAIL_STEPS];
            level *= 1 - failDepth * env * (1 - hold);
          }
        }
        machineLevels[i] = level;
      }

      for (let i = 0; i < tubeCount; i++) {
        const tube = tubes[i];
        let level = 1 + humDepth * Math.sin(t * TAU * tube.hum + tube.phase);
        const p = tube.stutter(t);
        if (p >= 0) {
          level *= STUTTER[Math.min(STUTTER.length - 1, Math.floor(p * STUTTER.length))];
        }
        tubeLevels[i] = level;
      }

      for (let i = 0; i < blinkCount; i++) {
        const b = blinks[i];
        const swing = 0.5 + 0.5 * Math.sin(t * b.rate + b.phase);
        // Smoothstep, not the raw sine: it lingers at each end of the swing, so
        // the lamp reads as holding bright and holding dim rather than sliding
        // continuously between the two.
        const eased = swing * swing * (3 - 2 * swing);
        blinkLevels[i] = 1 - b.depth + 2 * b.depth * eased;
      }
    }

    return { step, machineLevels, tubeLevels, blinkLevels };
  }

  // ===========================================================================
  // Snow, falling across the front of the scene
  // ===========================================================================

  /**
   * Snow drawn as hard-edged squares on whole art pixels. Anti-aliased dots
   * would be the obvious thing and they are wrong here: a soft circle over
   * pixel art looks like a smudge on the screen rather than part of the
   * picture.
   *
   * The snow falls in front of everything, from the top of the frame down onto
   * the pavement, where each flake breaks into a small puff and is respawned.
   * Nothing settles anywhere else: the machines and the shopfront are vertical
   * faces, and snow resting on them would read as dirt rather than weather.
   */
  function createSnow(canvas, plate, props) {
    const ctx = canvas.getContext('2d');
    const ART_W = plate.width;
    const ART_H = plate.height;

    const total = Math.max(0, Math.round(num(props.snowCount, 260)));
    const speedScale = num(props.snowSpeed, 1);
    const drift = num(props.snowDrift, 0.3);
    const sway = num(props.snowSway, 8);
    const swayRate = num(props.snowSwayRate, 1);
    const color = nums(props.snowColor, [214, 232, 255]);

    const sizes = nums(props.snowSizes, [3, 4, 6]);
    const speeds = nums(props.snowSpeeds, [17, 29, 46]); // art pixels per second
    const shares = nums(props.snowShares, [0.46, 0.34, 0.2]);
    const alphas = nums(props.snowAlphas, [0.3, 0.5, 0.74]);

    // Where a flake comes to rest. The pavement is a receding plane seen almost
    // edge on, so depth reads as height: the small far flakes settle at the back
    // of the slab and the big near ones at its front lip. Landing them all on
    // one line would flatten the picture.
    const landBand = nums(props.landBand, [0.806, 0.894]);
    const landTopArt = clamp01(num(landBand[0], 0.806)) * ART_H;
    const landBotArt = clamp01(num(landBand[1], 0.894)) * ART_H;

    const LAND_LIFE = Math.max(0.05, num(props.landLife, 0.42));
    const landings = [];

    const rnd = mulberry32(Math.round(num(props.seed, 7)) * 22695477 + 3);

    const lastLayer = Math.max(1, sizes.length - 1);
    const layers = sizes.map((size, i) => {
      const n = Math.max(0, Math.round(total * num(shares[i], 0.33)));
      // 0 = furthest layer, 1 = nearest.
      const depth = i / lastLayer;
      return {
        size: Math.max(1, Math.round(size)),
        speed: num(speeds[i], 24) * speedScale,
        alpha: clamp01(num(alphas[i], 0.5)),
        rest: landTopArt + (landBotArt - landTopArt) * depth,
        n,
        x: new Float32Array(n),
        y: new Float32Array(n),
        land: new Float32Array(n),
        phase: new Float32Array(n),
        rate: new Float32Array(n),
        amp: new Float32Array(n)
      };
    });

    const spawn = (layer, i, fromTop) => {
      layer.x[i] = -60 + rnd() * (ART_W + 120);
      // Off the top of the frame, so a flake drifts into shot rather than
      // popping into existence at the edge.
      layer.y[i] = fromTop ? -40 - rnd() * ART_H * 0.35 : rnd() * layer.rest;
      // A slab is deeper than it is tall on screen; jittering the rest height
      // keeps the settle line from reading as a drawn rule.
      layer.land[i] = layer.rest + (rnd() - 0.5) * (landBotArt - landTopArt) * 0.42;
      layer.phase[i] = rnd() * TAU;
      // Radians per second: a wobble every three to eight seconds. Faster and
      // the flakes swirl like ash; slower and they simply fall in a line.
      layer.rate[i] = (0.8 + rnd() * 1.4) * swayRate;
      layer.amp[i] = sway * (0.4 + rnd() * 0.9);
    };
    for (const layer of layers) {
      for (let i = 0; i < layer.n; i++) spawn(layer, i, false);
    }

    let width = 1;
    let height = 1;
    let unit = 1; // screen pixels per art pixel
    let originX = 0;
    let originY = 0; // art origin relative to the TOP OF THIS CANVAS, not the screen

    /**
     * Places the window band on screen and returns where this canvas belongs.
     * Both halves live here so the cover fit is worked out once: the mapping
     * needs the whole screen, while the canvas only covers the band, and doing
     * those in two places is how they drift apart.
     */
    function layout(w, h) {
      const screenAspect = w / h;
      const imageAspect = ART_W / ART_H;
      const sx = screenAspect > imageAspect ? 1 : screenAspect / imageAspect;
      // Cover keeps the scale equal on both axes, so one unit is enough.
      unit = w / sx / ART_W;
      originX = w / 2 - (ART_W / 2) * unit;
      originY = h / 2 - (ART_H / 2) * unit;

      // Full screen: the snow falls in front of the machines now, so it is no
      // longer confined to the window and the canvas has to cover everything.
      width = w;
      height = h;
      return { top: 0, height: h };
    }

    function update(dt, time) {
      for (const layer of layers) {
        const dy = layer.speed * dt;
        const dx = dy * drift;
        for (let i = 0; i < layer.n; i++) {
          layer.y[i] += dy;
          layer.x[i] += dx;

          if (layer.y[i] >= layer.land[i]) {
            // Record the landing at the flake's swayed position, not its raw x,
            // or the puff appears beside the flake that made it.
            landings.push({
              x: layer.x[i] + Math.sin(time * layer.rate[i] + layer.phase[i]) * layer.amp[i],
              y: layer.land[i],
              size: layer.size,
              alpha: layer.alpha,
              age: 0
            });
            spawn(layer, i, true);
          } else if (layer.x[i] > ART_W + 60) {
            layer.x[i] -= ART_W + 120;
          }
        }
      }

      for (let i = landings.length - 1; i >= 0; i--) {
        landings[i].age += dt;
        if (landings[i].age >= LAND_LIFE) landings.splice(i, 1);
      }
    }

    const rgba = (a) => 'rgba(' + color[0] + ', ' + color[1] + ', ' + color[2] + ', ' + a + ')';

    /**
     * The puff a flake leaves when it hits the pavement: the flake flattens and
     * two specks skip outward. Drawn on whole pixels like everything else - a
     * soft radial burst would read as a smudge against this art.
     */
    function drawLanding(l) {
      const t = l.age / LAND_LIFE;
      const px = Math.max(1, Math.round(l.size * unit));
      const x = Math.round(originX + l.x * unit);
      const y = Math.round(originY + l.y * unit);

      ctx.fillStyle = rgba((1 - t) * l.alpha * 0.85);
      // Core: spreads sideways and thins as it settles.
      const halfW = Math.max(1, Math.round(px * (0.5 + t * 1.1)));
      const hgt = Math.max(1, Math.round(px * (1 - t * 0.6)));
      ctx.fillRect(x - halfW, y, halfW * 2, hgt);

      // Two specks, up and out, then gone.
      if (t < 0.75) {
        const out = Math.round(t * px * 2.6);
        const up = Math.round(Math.sin(t * Math.PI) * px * 1.4);
        ctx.fillStyle = rgba((1 - t / 0.75) * l.alpha * 0.7);
        ctx.fillRect(x - out - px, y - up, px, px);
        ctx.fillRect(x + out, y - up, px, px);
      }
    }

    function draw(time) {
      ctx.clearRect(0, 0, width, height);

      for (const layer of layers) {
        ctx.fillStyle = rgba(layer.alpha);
        const px = Math.max(1, Math.round(layer.size * unit));
        for (let i = 0; i < layer.n; i++) {
          const ay = layer.y[i];
          if (ay < -20) continue;
          const ax = layer.x[i] + Math.sin(time * layer.rate[i] + layer.phase[i]) * layer.amp[i];

          // Whole pixels on both axes. A fractional rect would be feathered by
          // the rasteriser, which is the one thing this picture cannot take.
          ctx.fillRect(Math.round(originX + ax * unit), Math.round(originY + ay * unit), px, px);
        }
      }

      for (const l of landings) drawLanding(l);
    }

    return { layout, update, draw };
  }

  // ===========================================================================

  async function boot() {
    const config = await window.wallpaperForge.getConfig();
    if (!config || !config.wallpaper) return fail('No wallpaper assigned.');
    const properties = config.wallpaper.properties || {};

    const gl = glCanvas.getContext('webgl2', {
      antialias: false,
      alpha: false,
      powerPreference: 'low-power'
    });
    if (!gl) return fail('WebGL2 is not available on this machine.');

    // Same origin as this page, so no CORS opt-in is needed for the upload.
    const image = await loadImage('media/plate.png');
    const plate = analysePlate(image);
    if (!plate.machines.length) return fail('Could not find any lit panels in this plate.');

    const program = buildProgram(gl);
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(program, 'aPos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); // uv.y = 0 is the top of the image
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    const u = (name) => gl.getUniformLocation(program, name);

    gl.uniform1i(u('uImage'), 0);
    gl.uniform1f(u('uImageAspect'), plate.width / plate.height);
    gl.uniform2f(u('uPlate'), plate.width, plate.height);
    gl.uniform2f(u('uFloorBand'), plate.floorBand[0], plate.floorBand[1]);

    // How far each light fades out at its edge. Wide enough that the rectangle
    // never reads as a rectangle, narrow enough that a machine's glow stops at
    // its own bezel instead of washing over its neighbour.
    const glassFeather = nums(properties.glassFeather, [0.005, 0.008]);
    const tubeFeather = nums(properties.tubeFeather, [0.008, 0.004]);
    // A lamp is smaller than the other lights by an order of magnitude, so its
    // feather has to be too: the glass feather alone is wider than most of them.
    const blinkFeather = nums(properties.blinkFeather, [0.002, 0.003]);
    const bloomLevels = nums(properties.bloomLevels, [0.45, 0.78]);
    gl.uniform2f(u('uGlassFeather'), glassFeather[0], glassFeather[1]);
    gl.uniform2f(u('uTubeFeather'), tubeFeather[0], tubeFeather[1]);
    gl.uniform2f(u('uBlinkFeather'), blinkFeather[0], blinkFeather[1]);
    gl.uniform2f(u('uBloomLevels'), bloomLevels[0], bloomLevels[1]);
    gl.uniform1f(u('uFloorFeather'), num(properties.floorFeather, 0.02));
    gl.uniform1f(u('uFloorGain'), num(properties.floorGain, 0.5));
    gl.uniform1f(u('uFloorWobble'), num(properties.floorWobble, 1.8));
    gl.uniform1f(u('uFloorWobbleRate'), num(properties.floorWobbleRate, 1));
    gl.uniform1f(u('uBloom'), num(properties.bloom, 0.1));

    // Only the levels change per frame, so the footprints go up once here and
    // the levels go up as their own array.
    const machineGlass = new Float32Array(MAX_MACHINES * 4);
    const machineCol = new Float32Array(MAX_MACHINES * 2);
    const machineLevel = new Float32Array(MAX_MACHINES).fill(1);
    plate.machines.forEach((m, i) => {
      machineGlass.set(m.glass, i * 4);
      machineCol.set(m.col, i * 2);
    });
    const tubeRect = new Float32Array(MAX_TUBES * 4);
    const tubeLevel = new Float32Array(MAX_TUBES).fill(1);
    plate.tubes.forEach((t, i) => tubeRect.set(t, i * 4));

    // The strongest few lamps, and no more than a couple off any one machine,
    // so a machine with a busy panel cannot take over the row. They arrive
    // ranked, so this keeps the best of them wherever they are.
    const perMachine = Math.max(0, Math.round(num(properties.blinkPerMachine, 2)));
    const taken = new Map();
    const blinkers = [];
    for (const b of plate.blinkers) {
      if (blinkers.length >= MAX_BLINKERS) break;
      const n = taken.get(b.machine) || 0;
      if (n >= perMachine) continue;
      taken.set(b.machine, n + 1);
      blinkers.push(b);
    }

    // Padded by the feather, so the ramp falls on the housing outside the lamp
    // and the lamp itself swings at the full level. Without this a lamp four
    // art pixels wide would be all edge.
    const blinkRect = new Float32Array(MAX_BLINKERS * 4);
    const blinkLevel = new Float32Array(MAX_BLINKERS).fill(1);
    blinkers.forEach((b, i) => {
      blinkRect.set(
        [
          b.rect[0] - blinkFeather[0],
          b.rect[1] + blinkFeather[0],
          b.rect[2] - blinkFeather[1],
          b.rect[3] + blinkFeather[1]
        ],
        i * 4
      );
    });

    gl.uniform1i(u('uMachineCount'), plate.machines.length);
    gl.uniform1i(u('uTubeCount'), plate.tubes.length);
    gl.uniform1i(u('uBlinkCount'), blinkers.length);
    gl.uniform4fv(u('uMachineGlass'), machineGlass);
    gl.uniform2fv(u('uMachineCol'), machineCol);
    gl.uniform4fv(u('uTubeRect'), tubeRect);
    gl.uniform4fv(u('uBlinkRect'), blinkRect);
    const uMachineLevel = u('uMachineLevel');
    const uTubeLevel = u('uTubeLevel');
    const uBlinkLevel = u('uBlinkLevel');

    const lights = createLights(properties, plate.machines.length, plate.tubes.length, blinkers.length);
    const snow = createSnow(fxCanvas, plate, properties);
    const uResolution = u('uResolution');
    const uTime = u('uTime');

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(window.innerWidth * dpr));
      const h = Math.max(1, Math.round(window.innerHeight * dpr));

      glCanvas.width = w;
      glCanvas.height = h;
      gl.viewport(0, 0, w, h);
      gl.uniform2f(uResolution, w, h);

      const rect = snow.layout(w, h);
      fxCanvas.width = w;
      fxCanvas.height = rect.height;
      fxCanvas.style.top = rect.top / dpr + 'px';
      fxCanvas.style.width = w / dpr + 'px';
      fxCanvas.style.height = rect.height / dpr + 'px';
    }
    resize();
    window.addEventListener('resize', resize);

    let raf = null;
    let last = performance.now();
    let clock = 0;

    function frame(now) {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      clock += dt;

      lights.step(clock);
      machineLevel.set(lights.machineLevels);
      tubeLevel.set(lights.tubeLevels);
      blinkLevel.set(lights.blinkLevels);
      gl.uniform1fv(uMachineLevel, machineLevel);
      gl.uniform1fv(uTubeLevel, tubeLevel);
      gl.uniform1fv(uBlinkLevel, blinkLevel);
      gl.uniform1f(uTime, clock);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      snow.update(dt, clock);
      snow.draw(clock);
    }

    function start() {
      if (raf !== null) return;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
    function stop() {
      if (raf === null) return;
      cancelAnimationFrame(raf);
      raf = null;
    }

    // This runs 24/7 behind the desktop, so a live rAF while paused would burn
    // CPU forever.
    window.wallpaperForge.onPause((paused) => (paused ? stop() : start()));
    if (!window.wallpaperForge.isPaused()) start();
  }

  boot().catch((err) => fail(String(err && err.message ? err.message : err)));
</script>
