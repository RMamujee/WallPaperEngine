<!doctype html>
<meta charset="utf-8" />
<title>WallpaperForge - video</title>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #error {
    position: fixed;
    inset: 0;
    display: none;
    place-content: center;
    font: 500 15px/1.6 system-ui, sans-serif;
    color: #8b93a7;
    text-align: center;
    padding: 8vh 10vw;
  }
</style>
<video id="v" loop muted playsinline autoplay></video>
<div id="error"></div>

<script>
  const video = document.getElementById('v');
  const errorBox = document.getElementById('error');

  function fail(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'grid';
  }

  async function boot() {
    const config = await window.wallpaperForge.getConfig();
    if (!config || !config.wallpaper) return fail('No video assigned.');

    const { payload, properties } = config.wallpaper;
    if (!payload || !payload.source) return fail('This wallpaper has no video source.');

    video.src = payload.source;
    video.playbackRate = Number(properties?.playbackRate) || 1;
    video.style.objectFit = properties?.fit === 'contain' ? 'contain' : 'cover';

    applyVolume(config.volume);
    video.addEventListener('error', () => fail('Could not play this video. Try converting it to MP4 (H.264) or WebM.'));
    video.play().catch(() => {
      /* autoplay-policy switch normally prevents this; looping muted retries below */
    });

    window.wallpaperForge.onVolume(applyVolume);
    window.wallpaperForge.onPause((paused) => {
      if (paused) video.pause();
      else video.play().catch(() => {});
    });
  }

  function applyVolume(volume) {
    const v = Math.min(1, Math.max(0, Number(volume) || 0));
    video.muted = v === 0;
    video.volume = v;
  }

  boot().catch((err) => fail(String(err)));
</script>
